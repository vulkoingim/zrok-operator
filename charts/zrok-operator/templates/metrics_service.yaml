{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zrok-operator.fullname" . }}-metrics
  labels:
    {{- include "zrok-operator.labels" . | nindent 4 }}
spec:
  ports:
    - name: metrics
      port: 8443
      protocol: TCP
      targetPort: metrics
  selector:
    {{- include "zrok-operator.selectorLabels" . | nindent 4 }}
{{- end }}
