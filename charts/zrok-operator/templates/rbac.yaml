{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "zrok-operator.fullname" . }}
  labels:
    {{- include "zrok-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["zrok.k8s.zrok.io"]
    resources: ["zrokenvironments", "zrokshares", "zrokaccesses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["zrok.k8s.zrok.io"]
    resources: ["zrokenvironments/status", "zrokshares/status", "zrokaccesses/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["zrok.k8s.zrok.io"]
    resources: ["zrokenvironments/finalizers", "zrokshares/finalizers", "zrokaccesses/finalizers"]
    verbs: ["update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["kube-system"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "zrok-operator.fullname" . }}
  labels:
    {{- include "zrok-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "zrok-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "zrok-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
