# Default values for zrok-operator.
replicaCount: 1

image:
  repository: ghcr.io/vulkoingim/zrok-operator
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Install CRDs are shipped under charts/zrok-operator/crds/ (Helm installs them on first install).
installCRDs: true

# Default zrok API endpoint used when Environment.spec.apiEndpoint is empty
# (operator itself does not require a global endpoint; Environments set their own).
apiEndpoint: ""

# Prefer creating the Secret out-of-band:
#   kubectl create secret generic zrok-credentials \
#     --from-literal=enable-token=$ZROK2_ENABLE_TOKEN
# Inline token creation is for quickstarts only.
credentials:
  secretName: ""
  create: false
  enableToken: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

leaderElect: true

metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    labels: {}

# NetworkPolicy requires a CNI that implements them (Calico, Cilium, cloud CNIs).
# Kind + Flannel ignore the objects. Off by default.
# When enabled: manager NetworkPolicy in this namespace, and the operator creates
# per-agent NetworkPolicies (gRPC :7777 only from this manager).
networkPolicy:
  enabled: false
  # Extra ingress peers for manager metrics :8443. Empty = any source on that port.
  metricsFrom: []
  # - namespaceSelector:
  #     matchLabels:
  #       kubernetes.io/metadata.name: monitoring

security:
  # Extra https hosts allowed in ZrokEnvironment.spec.apiEndpoint.
  # api-v2.zrok.io is always allowed. http:// is never allowed.
  apiEndpointAllowlist: []
  # Extra agent images allowed in spec.agent.image. Default zrok2 pin is always allowed.
  agentImageAllowlist: []
  # Require ZrokShare.spec.upstream to be a Service in the Share namespace; disable socks.
  restrictUpstream: false

# Agent defaults (documentation / extra allowlist source). Operator pins DefaultImage in code.
agent:
  image: docker.io/openziti/zrok2:2.0.4
