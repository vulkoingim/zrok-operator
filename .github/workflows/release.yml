name: release

on:
  push:
    tags:
      - "v*"

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_NOT_FOUND_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"
  KIND_NODE_IMAGE: kindest/node:v1.36.1

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          cache: true
          cache_save: false

      - uses: azure/setup-helm@v5

      # COPY-only Dockerfile; QEMU not required (Go already cross-compiled the binary).
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: vuln and release check
        run: |
          go mod tidy && git diff --exit-code go.mod go.sum
          govulncheck ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Distinct from the operator image (ghcr.io/<owner>/zrok-operator).
      - name: Push Helm chart to GHCR
        run: |
          shopt -s nullglob
          charts=(dist/helm/zrok-operator-*.tgz)
          if [[ ${#charts[@]} -ne 1 ]]; then
            echo "expected exactly one chart tgz under dist/helm, got: ${charts[*]-none}" >&2
            exit 1
          fi
          helm push "${charts[0]}" "oci://ghcr.io/${{ github.repository_owner }}/charts"
