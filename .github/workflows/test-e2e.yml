name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    name: E2E
    runs-on: ubuntu-latest
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_NOT_FOUND_AUTO_INSTALL: "false"
      MISE_EXEC_AUTO_INSTALL: "false"
      KIND_NODE_IMAGE: kindest/node:v1.36.1
    steps:
      - uses: actions/checkout@v6

      # Restore BEFORE mise-action. `go:` tools write read-only files into
      # ~/go/pkg/mod; tar restore on top of those fails with "File exists".
      - name: Cache Go modules and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Setup mise
        uses: jdx/mise-action@v6
        with:
          cache: true
          # Full [tools] — same cache key as test.yml. Do not pass install_args:
          # mise-action saves cache at the end of THIS step, so tools installed
          # later by `mise run` (task auto-install) never get cached.

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Check go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Cache kind node image
        id: kind-image
        uses: actions/cache@v7
        with:
          path: /tmp/kindest-node.tar
          key: kindest-node-${{ runner.os }}-${{ env.KIND_NODE_IMAGE }}

      - name: Load kind node image
        if: steps.kind-image.outputs.cache-hit == 'true'
        run: docker load -i /tmp/kindest-node.tar

      - uses: docker/setup-buildx-action@v4

      - name: Create kind cluster
        run: mise run kind-up

      - name: Pack kind node image
        if: steps.kind-image.outputs.cache-hit != 'true'
        run: docker save "$KIND_NODE_IMAGE" -o /tmp/kindest-node.tar

      - name: E2E
        env:
          GOFLAGS: -mod=readonly
          ZROK2_ENABLE_TOKEN: ${{ secrets.ZROK2_ENABLE_TOKEN }}
        run: mise run test-e2e
