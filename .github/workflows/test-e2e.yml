name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.2
          cache: true
          # Tools for kind-up / docker-build / gen / e2e.
          install_args: >-
            go
            kind
            kubectl
            kustomize
            go:github.com/vektra/mockery/v3
            go:sigs.k8s.io/controller-tools/cmd/controller-gen

      - name: Cache Go modules and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Check go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Create kind cluster
        run: mise run kind-up

      - name: E2E
        env:
          GOFLAGS: -mod=readonly
          ZROK2_ENABLE_TOKEN: ${{ secrets.ZROK2_ENABLE_TOKEN }}
        run: mise run test-e2e
