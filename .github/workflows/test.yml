name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # `mise run` otherwise auto-installs every [tools] entry not already present.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_NOT_FOUND_AUTO_INSTALL: "false"
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v6

      # Restore BEFORE mise-action. `go:` tools write read-only files into
      # ~/go/pkg/mod; tar restore on top of those fails with "File exists"
      # and GitHub then reports a cache miss (~12s of wasted extract).
      - name: Cache Go modules and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          cache: true
          # Full [tools] so this cache key is shared with e2e (no install_args hash split).

      - name: Cache envtest assets
        uses: actions/cache@v6
        with:
          path: bin/k8s
          key: envtest-${{ runner.os }}-1.36-${{ hashFiles('mise.toml') }}
          restore-keys: |
            envtest-${{ runner.os }}-1.36-

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Check go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Test
        env:
          GOFLAGS: -mod=readonly
        run: mise run test
