name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_NOT_FOUND_AUTO_INSTALL: "false"
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v6

      # Same Go cache as test/e2e. Restore BEFORE mise (`go:` tools → read-only pkg/mod).
      - name: Cache Go modules and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          cache: true
          # Full [tools] — shares the golangci-lint binary with test/e2e.
          # golangci-lint-action always re-downloads the binary even on analysis-cache hit.

      - name: Cache golangci-lint analysis
        uses: actions/cache@v6
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('.golangci.yml', 'go.sum', 'mise.toml') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            golangci-${{ runner.os }}-${{ hashFiles('.golangci.yml', 'go.sum', 'mise.toml') }}-

      - name: Lint
        run: |
          golangci-lint config verify
          mise run lint
