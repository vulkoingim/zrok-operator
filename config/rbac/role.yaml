  resources:
  - zrokaccesses
  - zrokenvironments
  - zrokshares
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - zrok.k8s.zrok.io
  resources:
  - zrokaccesses/finalizers
  - zrokenvironments/finalizers
  - zrokshares/finalizers
  verbs:
  - update
- apiGroups:
  - zrok.k8s.zrok.io
  resources:
  - zrokaccesses/status
  - zrokenvironments/status
  - zrokshares/status
  verbs:
  - get
  - patch
  - update
