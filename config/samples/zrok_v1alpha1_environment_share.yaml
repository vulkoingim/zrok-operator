apiVersion: v1
kind: Secret
metadata:
  name: zrok-credentials
  namespace: default
type: Opaque
stringData:
  enable-token: "REPLACE_WITH_ZROK2_ENABLE_TOKEN"
---
apiVersion: zrok.k8s.zrok.io/v1alpha1
kind: ZrokEnvironment
metadata:
  name: default
  namespace: default
spec:
  # apiEndpoint: https://api-v2.zrok.io  # default; set for self-hosted openziti/zrok2 chart
  # uniqueID: ""  # omit = kube-system Namespace UUID
  enableTokenSecretRef:
    name: zrok-credentials
    key: enable-token
  reclaimPolicy: Delete
  agent:
    consolePort: 8888
---
# --- public + reserved (sticky URL; survives agent restart) ---
apiVersion: zrok.k8s.zrok.io/v1alpha1
kind: ZrokShare
metadata:
  name: d1592fdb60580fe884c3e43946d9
  namespace: default
spec:
  environmentRef:
    name: default
  shareMode: public
  backendMode: proxy
  upstream:
    url: http://nginx.default.svc:80
  nameSelection:
    namespace: public
    name: nginx-demo # DNS label ≤63; must be unique on your account
  reclaimPolicy: Delete
---
# --- public + ephemeral (random URL; gone when share ends) ---
