[tools]
go = "1.26"
"go:gotest.tools/gotestsum" = "latest"
"go:github.com/vektra/mockery/v3" = "latest"
"go:sigs.k8s.io/controller-tools/cmd/controller-gen" = "latest"
"go:sigs.k8s.io/controller-runtime/tools/setup-envtest" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"go:golang.org/x/exp/cmd/gorelease" = "latest"
cosign = "latest"
golangci-lint = "2.12.2"
kubectl = "1.36"
kind = "0.32"
helm = "4.2.4"
kustomize = "5.5.0"
kubebuilder = "4.15.0"
yq = "4.53"
kubeconform = "0.8.0"

[vars]
IMG = "zrok-operator:dev"
ENVTEST_K8S_VERSION = "1.36"

# --- short tasks -----------------------------------------------------------

[tasks.fmt]
description = "go fmt/vet"
run = """
go fmt ./...
go vet ./...
"""

[tasks.generate]
description = "Generate DeepCopy methods"
run = "controller-gen object:headerFile=hack/boilerplate.go.txt paths=./..."

[tasks.manifests]
description = "Generate CRDs + RBAC"
run = "controller-gen rbac:roleName=manager-role crd paths=./... output:crd:artifacts:config=config/crd/bases"

[tasks.mocks]
description = "Generate mocks"
run = "mockery"

[tasks.gen]
description = "generate + manifests + mocks + sync Helm CRDs"
depends = ["generate", "manifests", "mocks"]
run = "cp config/crd/bases/*.yaml charts/zrok-operator/crds/"

[tasks.test]
description = "Unit + envtest (excludes e2e)"
depends = ["gen", "fmt"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
ROOT="$(git rev-parse --show-toplevel)"
BIN_DIR="$ROOT/bin"
ASSETS="$(setup-envtest use "{{vars.ENVTEST_K8S_VERSION}}" --bin-dir "$BIN_DIR" -p path)"
KUBEBUILDER_ASSETS="$ASSETS" gotestsum --format testdox -- \
  $(go list ./... | grep -v /e2e) -coverprofile cover.out
'''

[tasks.test-verbose]
description = "Verbose unit + envtest"
depends = ["gen"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
ROOT="$(git rev-parse --show-toplevel)"
BIN_DIR="$ROOT/bin"
ASSETS="$(setup-envtest use "{{vars.ENVTEST_K8S_VERSION}}" --bin-dir "$BIN_DIR" -p path)"
KUBEBUILDER_ASSETS="$ASSETS" gotestsum --format standard-verbose -- \
  $(go list ./... | grep -v /e2e) -coverprofile cover.out
'''

[tasks.lint]
description = "golangci-lint --fix"
run = "golangci-lint run --fix"
